# A release for every pushed `v*` tag: the binaries for every platform (`make release`) on a GitHub
# Release with generated notes, and the multi-arch image on GitHub's registry (ghcr.io). A tag with
# a suffix (`v1.0.0-rc.1`) is a pre-release, and doesn't move `latest`. No checks run here: tags
# point at commits on main, which passed ci to get there.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # only ci.yml caches Go (see the rule in CLAUDE.md)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json # reads devEngines.runtime
      # VERSION from the tag, so file names and main.version say exactly `v1.2.3`
      - run: make setup release VERSION="$GITHUB_REF_NAME"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ $GITHUB_REF_NAME == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" bin/release/* --verify-tag --generate-notes "${prerelease[@]}"

  image:
    runs-on: ubuntu-latest
    permissions:
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # a builder that can build several platforms at once; the Dockerfile cross-compiles, so no QEMU
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - env:
          TOKEN: ${{ github.token }}
        run: |
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
          image="ghcr.io/${GITHUB_REPOSITORY,,}" # registry names must be lowercase
          flags="--platform linux/amd64,linux/arm64 --push"
          # the label links the image to this repository on GitHub
          flags+=" --label org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if [[ $GITHUB_REF_NAME != *-* ]]; then flags+=" -t $image:latest"; fi
          make docker IMAGE_NAME="$image" VERSION="$GITHUB_REF_NAME" DOCKER_FLAGS="$flags"
